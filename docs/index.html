<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forge Agent">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Forge Agent</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#0f1115;color:#e6e8ee;font:16px/1.45 -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid #232733;display:flex;gap:8px;align-items:center}
header b{flex:1}
button,select{background:#2a3350;color:#e6e8ee;border:0;border-radius:8px;padding:9px 12px;font-size:15px}
#model{padding:8px 12px;border-bottom:1px solid #232733;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#model select{flex:1;min-width:0}
#status{width:100%;font-size:13px;color:#8b93a7}
#bar{height:3px;background:#2a3350;width:100%;border-radius:2px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:#6ea8ff}
#log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:#2a3350}.a{align-self:flex-start;background:#1b1f2b}.s{align-self:center;color:#8b93a7;font-size:13px}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #232733}
textarea{flex:1;background:#1b1f2b;color:#e6e8ee;border:1px solid #2c3347;border-radius:10px;padding:10px;font:inherit;resize:none;height:46px}
</style></head><body>
<header><b>Forge Agent</b><button id="mem">Memory</button><button id="help">Help</button></header>
<div id="model">
  <select id="models" aria-label="Model"><option>loading model list...</option></select>
  <button id="load">Load model</button>
  <div id="bar"><i></i></div>
  <div id="status">Model not loaded. Slash commands work now.</div>
</div>
<div id="log"></div>
<form id="f"><textarea id="t" placeholder="Message, or /help"></textarea><button id="send">Send</button></form>
<script type="module" src="app.js"></script>
</body></html>
