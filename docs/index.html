<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="ui.css"><title>Forge Agent</title></head>
<body>
<header><a class="brand" href="#chat">Forge Agent</a><nav aria-label="Main navigation"><button data-page="chat" aria-current="page">Chat</button><button data-page="models">Models</button><button data-page="trainer">Trainer</button><button data-page="skills">Skills</button><button data-page="rules">Rules</button><button data-page="tutorial">Tutorial</button></nav><button id="mem" type="button">Memory</button><button id="help" type="button">Help</button></header>
<main>
<section id="screenChat" data-screen="chat" aria-label="Chat"><p id="chatModel" class="modelLine" role="status"></p><div id="log" aria-live="polite" aria-label="Conversation"></div><div id="composeArea"><form id="f"><div id="composer"><textarea id="t" rows="1" aria-label="Message" placeholder="Begin chat"></textarea><button type="button" id="upload" aria-label="Upload text files">Upload</button><input type="file" id="chatFiles" multiple hidden accept=".txt,.md,.json,.csv,.yaml,.yml,.js,.py,.log"></div><button id="send" type="submit">Send</button></form><div id="attachmentList" aria-label="Selected attachments"></div><p id="attachmentStatus" role="status" hidden></p></div></section>
<section id="screenModels" data-screen="models" hidden><h1>Models</h1><div id="modelsPage"></div></section>
<section id="screenTrainer" data-screen="trainer" hidden><h1>Trainer</h1><div id="trainerPage"></div></section>
<section id="screenSkills" data-screen="skills" hidden><h1>Skills</h1><div id="skillsPage"></div></section>
<section id="screenRules" data-screen="rules" hidden><h1>Rules</h1><div id="rulesPage"></div></section>
<section id="screenTutorial" data-screen="tutorial" hidden><h1>Tutorial</h1><div id="tutorialPage"></div><div id="tutorialMath"></div></section>
</main>
<script type="module" src="app.js"></script>
</body></html>
